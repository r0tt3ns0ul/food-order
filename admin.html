<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Food Club — Админ-панель</title>
<style>
:root{--bg:#101114;--panel:#191b20;--panel2:#242730;--muted:#9ca1ad;--text:#f7f7f8;--accent:#ff6b35;--line:#30333d;--green:#53c98a;--red:#ff6464}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-weight:900;font-size:22px}.muted{color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:18px}.login{max-width:410px;margin:10vh auto}.input,select,textarea{width:100%;background:#111318;border:1px solid #414550;border-radius:10px;padding:12px;color:white;font:inherit;margin:6px 0 13px}.btn{border:0;background:var(--accent);color:white;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#662c31}.btn:disabled{opacity:.5}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:10px 15px;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel2);padding:15px;border-radius:13px}.stat strong{display:block;font-size:25px;margin-top:6px}.product,.order{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--panel2)}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#37303a;color:#ffd1bd;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.hidden{display:none!important}.notice{padding:10px;border-radius:10px;background:#29232a;color:#ffd0bd;margin:10px 0;font-size:13px}.order{grid-template-columns:minmax(0,1fr) 180px}.order select{margin:0}.orderitems{font-size:13px;color:#c1c4cd;margin-top:5px;line-height:1.5}h2{margin:0 0 15px}h3{margin:0 0 7px}label{font-size:13px;color:#c8cbd3}@media(max-width:650px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.product{grid-template-columns:52px minmax(0,1fr)}.thumb{width:52px;height:52px}.product .actions{grid-column:1/-1;justify-content:flex-start}.order{grid-template-columns:1fr}.order select{max-width:100%}}
</style></head><body><div class="wrap">
<header><div class="brand">🍔 FOOD CLUB <div class="muted">Панель управления</div></div><div id="head-actions" class="hidden"><a href="/" style="color:#ff9a72;margin-right:12px">Открыть сайт</a><button class="btn secondary" onclick="logout()">Выйти</button></div></header>
<section id="login" class="panel login"><h2>Вход администратора</h2><div class="muted">Управление меню и заказами</div><label>Пароль администратора</label><input id="password" class="input" type="password" placeholder="Пароль"><button class="btn" style="width:100%" onclick="login()">Войти</button><div id="login-error" class="notice hidden"></div></section>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><span class="muted">Всего позиций в меню</span><strong id="stat-products">0</strong></div><div class="stat"><span class="muted">Заказов сегодня</span><strong id="stat-today">0</strong></div><div class="stat"><span class="muted">Новых заказов</span><strong id="stat-new">0</strong></div></div>
<div class="tabs" style="margin-top:20px"><button class="tab active" data-tab="orders" onclick="switchTab('orders')">Заказы</button><button class="tab" data-tab="products" onclick="switchTab('products')">Меню</button></div>
<div id="orders-tab"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Заказы</h2><button class="btn secondary" onclick="loadOrders()">Обновить</button></div><div class="muted">Статусы автоматически обновляются на сайте по номеру заказа. Список обновляется каждые 20 секунд.</div><div id="orders-list" style="margin-top:12px"></div></div></div>
<div id="products-tab" class="hidden">
<div class="panel"><h2 id="form-title">Добавить товар</h2><form id="product-form" onsubmit="saveProduct(event)"><input type="hidden" id="product-id"><div class="formgrid"><div><label>Название *</label><input class="input" id="name" required maxlength="100"></div><div><label>Категория *</label><input class="input" id="category" required placeholder="Бургеры"></div><div><label>Цена в тенге *</label><input class="input" id="price" type="number" min="0" step="1" required></div><div><label>Порядок сортировки</label><input class="input" id="sort" type="number" value="100"></div></div><label>Описание</label><textarea class="input" id="description" rows="2"></textarea><label>Ссылка на фото (URL)</label><input class="input" id="image" type="url" placeholder="https://..."><label style="display:flex;align-items:center;gap:8px;margin:4px 0 15px"><input type="checkbox" id="available" checked style="width:auto;margin:0"> Товар доступен для заказа</label><button class="btn" id="save-btn">Сохранить товар</button> <button class="btn secondary" type="button" onclick="resetForm()">Очистить</button></form><div id="product-message" class="notice hidden"></div></div>
<div class="panel"><h2>Все товары</h2><div id="products-list"></div></div>
</div></section></div>
<script>
let products=[],orders=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₸';
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}
async function login(){let b=document.querySelector('#login button');b.disabled=true;try{await api('/api/admin/auth',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});await start()}catch(e){let el=document.getElementById('login-error');el.textContent=e.message;el.classList.remove('hidden')}finally{b.disabled=false}}
async function logout(){await fetch('/api/admin/auth',{method:'DELETE'});location.reload()}
async function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('head-actions').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders()]);}
(async()=>{try{await api('/api/admin/auth');await start()}catch{}})();
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.getElementById('orders-tab').classList.toggle('hidden',t!=='orders');document.getElementById('products-tab').classList.toggle('hidden',t!=='products')}
async function loadProducts(){try{let d=await api('/api/admin/products');products=d.products||[];document.getElementById('stat-products').textContent=products.length;document.getElementById('products-list').innerHTML=products.map(p=>`<div class="product"><img class="thumb" src="${esc(p.image_url||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${money(p.price)}</div><span class="tag">${p.available?'В продаже':'Скрыт'}</span></div><div class="actions"><button class="btn secondary" onclick="editProduct('${p.id}')">Изменить</button><button class="btn ${p.available?'danger':'secondary'}" onclick="toggleProduct('${p.id}',${!p.available})">${p.available?'Скрыть':'Включить'}</button><button class="btn danger" onclick="deleteProduct('${p.id}')">Удалить</button></div></div>`).join('')||'<div class="muted">Товаров пока нет.</div>'}catch(e){alert(e.message)}}
function resetForm(){document.getElementById('product-form').reset();document.getElementById('product-id').value='';document.getElementById('available').checked=true;document.getElementById('sort').value=100;document.getElementById('form-title').textContent='Добавить товар'}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;document.getElementById('product-id').value=p.id;document.getElementById('name').value=p.name;document.getElementById('category').value=p.category;document.getElementById('price').value=p.price;document.getElementById('sort').value=p.sort_order;document.getElementById('description').value=p.description||'';document.getElementById('image').value=p.image_url||'';document.getElementById('available').checked=p.available;document.getElementById('form-title').textContent='Редактировать товар';window.scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(e){e.preventDefault();let id=document.getElementById('product-id').value;let payload={name:document.getElementById('name').value,category:document.getElementById('category').value,price:Number(document.getElementById('price').value),sort_order:Number(document.getElementById('sort').value),description:document.getElementById('description').value,image_url:document.getElementById('image').value,available:document.getElementById('available').checked};try{await api('/api/admin/products',{method:id?'PATCH':'POST',body:JSON.stringify(id?{id,...payload}:payload)});let m=document.getElementById('product-message');m.textContent='Товар сохранён.';m.classList.remove('hidden');resetForm();await loadProducts()}catch(e){alert(e.message)}}
async function toggleProduct(id,available){let p=products.find(x=>x.id===id);try{await api('/api/admin/products',{method:'PATCH',body:JSON.stringify({id,available})});await loadProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('Удалить товар? Старые заказы сохранят его название и цену.'))return;try{await api('/api/admin/products?id='+encodeURIComponent(id),{method:'DELETE'});await loadProducts()}catch(e){alert(e.message)}}
const statusLabels={new:'Новый',accepted:'Принят',cooking:'Готовится',ready:'Готов',completed:'Выдан',cancelled:'Отменён'};
async function loadOrders(){try{let d=await api('/api/admin/orders');orders=d.orders||[];let today=new Date().toLocaleDateString('en-CA');document.getElementById('stat-today').textContent=orders.filter(o=>new Date(o.created_at).toLocaleDateString('en-CA')===today).length;document.getElementById('stat-new').textContent=orders.filter(o=>o.status==='new').length;document.getElementById('orders-list').innerHTML=orders.map(o=>`<div class="order"><div><b>#${esc(o.order_number)} · ПК-${esc(o.pc_number)}</b><div class="muted">${new Date(o.created_at).toLocaleString('ru-RU')} · ${money(o.total)}</div><div class="orderitems">${(o.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}`).join('<br>')}</div></div><div><select onchange="setStatus('${o.id}',this.value)">${Object.entries(statusLabels).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join('')||'<div class="muted">Заказов пока нет.</div>'}catch(e){document.getElementById('orders-list').textContent=e.message}}
async function setStatus(id,status){try{await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({id,status})});await loadOrders()}catch(e){alert(e.message);await loadOrders()}}
setInterval(()=>{if(!document.getElementById('app').classList.contains('hidden'))loadOrders()},20000);
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
